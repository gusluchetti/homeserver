services:
  homer:
    container_name: homer
    image: b4bz/homer:latest
    volumes:
      - /homeserver/appdata/homer:/www/assets
    ports:
      - "8181:8080"

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:latest
    volumes:
      - /homeserver/appdata/transmission:/config
      - /homeserver/data/torrents:/data/torrents
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "9091:9091"

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    volumes:
      - /homeserver/appdata/jellyfin:/config
      - /homeserver/appdata/jellyfin/cache:/cache
      - /homeserver/data/media:/media
    ports:
      - "8096:8096"

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    volumes:
      - /homeserver/appdata/nextcloud:/var/www/html
    ports:
      - "8080:80"
    environment:
      - SQLITE_DATABASE=nextcloud

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /homeserver/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /homeserver/appdata/sonarr:/config
      - /homeserver/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped
