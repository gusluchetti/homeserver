services:
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - /lab/appdata/homarr/configs:/app/data/configs
      - /lab/appdata/homarr/icons:/app/public/icons
      - /lab/appdata/homarr/data:/data
    ports:
      - '7575:7575'

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:latest
    volumes:
      - /lab/appdata/transmission:/config
      - /lab/data/torrents:/data/torrents
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "9091:9091"

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    volumes:
      - /lab/appdata/jellyfin:/config
      - /lab/appdata/jellyfin/cache:/cache
      - /lab/data/media:/media
    ports:
      - "8096:8096"

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    volumes:
      - /lab/appdata/nextcloud:/var/www/html
    ports:
      - "8080:80"
    environment:
      - SQLITE_DATABASE=nextcloud

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /lab/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /lab/appdata/sonarr:/config
      - /lab/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /lab/appdata/radarr:/config
      - /lab/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /lab/appdata/bazarr:/config
      - /lab/data:/data
    ports:
      - 6767:6767
    restart: unless-stopped
