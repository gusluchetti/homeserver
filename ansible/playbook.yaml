---
- hosts: lab
  become: yes
  vars:
    lab_directory: "/lab/"

  pre_tasks:
    - name: Update and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist

  tasks:
    - name: Install misc. dependencies
      apt:
        name:
          - ca-certificates
          - curl

    - name: Setup Docker repository
      # TODO: check how to run multiple commands like this
      command:
        - sudo install -m 0755 -d /etc/apt/keyrings
        - sudo curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
        - sudo chmod a+r /etc/apt/keyrings/docker.asc


    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Create lab directory
      file:
        path: "{{ lab_directory }}"
        state: directory
        mode: '0755'

  handlers:
    - name: Restart docker
      service:
        name: docker
        state: restarted
