name: lab

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - /lab/appdata/qbittorrent:/config
      - /lab/data:/data
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    volumes:
      - /lab/appdata/jellyfin:/config
      - /lab/appdata/jellyfin/cache:/cache
      - /lab/data/media:/media
    ports:
      - "8096:8096"

  nextcloud:
    container_name: nextcloud
    image: nextcloud
    volumes:
      - /lab/appdata/nextcloud:/var/www/html
    ports:
      - "8080:80"
    environment:
      - SQLITE_DATABASE=nextcloud

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /lab/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /lab/appdata/sonarr:/config
      - /lab/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /lab/appdata/radarr:/config
      - /lab/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /lab/appdata/bazarr:/config
      - /lab/data:/data
    ports:
      - 6767:6767
    restart: unless-stopped
